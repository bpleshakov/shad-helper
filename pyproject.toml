[project]
name = "shad-helper"
version = "0.1.0"
description = "Local Russian audio transcription and transcript-grounded LaTeX notes"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "PyJWT[crypto]>=2.10",
    "pymupdf>=1.26",
    "genanki==0.13.1",
]

[project.optional-dependencies]
local = [
    "mlx-vlm>=0.7.6",
    "mlx-whisper>=0.4.3",
    "numpy>=2.4",
    "opencv-python>=4.13",
    "pillow>=12",
]

[project.scripts]
shad-helper = "shad_helper.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shad_helper*"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13", "anki==26.9.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
